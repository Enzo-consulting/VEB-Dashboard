services:
  - type: web
      name: veb-dashboard
          runtime: node
              buildCommand: npm install
                  startCommand: node server.js
                      envVars:
                            - key: NODE_ENV
                                    value: production
                                          - key: VEB_TOKEN
                                                  sync: false
                                                        - key: ADMIN_USER
                                                                sync: false
                                                                      - key: ADMIN_PASS
                                                                              sync: false
                                                                                    - key: GUEST_USER
                                                                                            sync: false
                                                                                                  - key: GUEST_PASS
                                                                                                          sync: false
                                                                                                                - key: SUPABASE_URL
                                                                                                                        sync: false
                                                                                                                              - key: SUPABASE_PUBLISHABLE_KEY
                                                                                                                                      sync: false
                                                                                                                                            - key: SUPABASE_SECRET_KEY
                                                                                                                                                    sync: false
                                                                                                                                                          - key: SUPABASE_JWKS_URL
                                                                                                                                                                  sync: false
                                                                                                                                                                        - key: OPENAI_API_KEY
                                                                                                                                                                                sync: false
